name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Run mock API tests
        run: pytest tests/mock_api/ -v

      - name: Run UI tests
        env:
          VERKADA_EMAIL: ${{ secrets.VERKADA_EMAIL }}
          VERKADA_PASSWORD: ${{ secrets.VERKADA_PASSWORD }}
          VERKADA_TOTP_SECRET: ${{ secrets.VERKADA_TOTP_SECRET }}
          VERKADA_ORG_URL: ${{ secrets.VERKADA_ORG_URL }}
        run: pytest tests/ui/ -v
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
